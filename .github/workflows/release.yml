# Builds Good Time for Windows, Android and iOS and attaches the packages to a GitHub Release.
# Push a tag like v0.2.0 to publish one. Run it by hand (Actions tab) to build without publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - name: App icon and splash (falls back to the default icon if this fails)
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#14171c' --iconBackgroundColorDark '#14171c' --splashBackgroundColor '#14171c' --splashBackgroundColorDark '#14171c'
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: |
          V=$(node -p "require('./package.json').version")
          mkdir out && cp android/app/build/outputs/apk/debug/app-debug.apk "out/Good-Time-$V-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  ios:
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap add ios
      - name: App icon and splash (falls back to the default icon if this fails)
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --ios --iconBackgroundColor '#14171c' --iconBackgroundColorDark '#14171c' --splashBackgroundColor '#14171c' --splashBackgroundColorDark '#14171c'
      - run: npx cap sync ios
      - name: Build unsigned app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out Payload
          cp -R ios-build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "out/Good-Time-$V-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*.ipa

  publish:
    needs: [windows, android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
        run: npm ci && npm run build
      - run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out && (cd dist && zip -qr "../out/Good-Time-$V-web.zip" .)
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            **Play in a browser, no install:** https://felixdallesandro.github.io/Good-Time/ (installs as an app from Chrome, Edge or Safari, and works offline).

            | Platform | File | How to install |
            |---|---|---|
            | Windows | `…-windows-setup.exe` | Run it and choose where to install. The app isn't code-signed, so SmartScreen may warn: *More info* → *Run anyway*. |
            | Windows | `…-windows-portable.exe` | No install. Run it from anywhere. |
            | Android | `…-android.apk` | Download on the phone and open it. Allow installs from your browser when Android asks. |
            | iOS | `…-ios-unsigned.ipa` | Unsigned, so an iPhone won't install it directly. Sideload it with AltStore or Sideloadly, or use the web version: open the link above in Safari, then Share → *Add to Home Screen*. |
            | Any | `…-web.zip` | The static site. Unzip and open `index.html`, or host the folder. |
